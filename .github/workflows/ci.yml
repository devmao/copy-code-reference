name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run compile

      - name: Package VSIX
        run: npx vsce package --out copy-code-reference.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: copy-code-reference-vsix
          path: copy-code-reference.vsix
